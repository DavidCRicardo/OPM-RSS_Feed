name: Auto Update One Punch Man JSON (WeebCentral)

on:
  schedule:
    - cron: '0 */6 * * *'      # Every 6 hours
  workflow_dispatch:           # Allows manual run

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone Weeb-dl and prepare weeb_central folder
        run: |
          git clone https://github.com/UnKnowNModder/Weeb-dl.git /tmp/Weeb-dl
          cp -r /tmp/Weeb-dl/weeb weeb_central
          echo "✅ weeb_central folder prepared"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 Pillow fpdf2 ua-generator

      - name: Update JSON (fetch new chapters)
        run: |
          python get_chapters.py

      - name: Generate RSS from updated JSON
        run: |
          python generate_rss.py

      - name: Commit and push if changed
        run: |
          git config user.name "OPM Auto Bot"
          git config user.email "bot@noreply.com"
          
          git add opm_weebcentral.json opm.rss
          
          if git diff --staged --quiet; then
            echo "No new chapters - nothing to commit"
          else
            git commit -m "Auto-update: new One Punch Man chapter(s)"
            git push
          fi
