name: Auto-update One Punch Man RSS

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Generate fresh opm.rss
        run: python generate_rss.py

      - name: Commit & push if changed
        run: |
          git config user.name "OPM Auto Bot"
          git config user.email "bot@noreply.com"
          git add opm.rss
          git diff --quiet --exit-code opm.rss || git commit -m "Auto-update: new One Punch Man chapter(s)"
          git push
