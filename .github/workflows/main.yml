name: Auto-update One Punch Man RSS

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone Weeb-dl and prepare weeb_central folder
        run: |
          git clone https://github.com/UnKnowNModder/Weeb-dl.git /tmp/Weeb-dl
          cp -r /tmp/Weeb-dl/weeb weeb_central
          touch weeb_central/__init__.py
          echo "✅ weeb_central folder ready"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 Pillow fpdf2 ua-generator

      - name: Run update_opm_rss.py
        run: |
          python update_opm_rss.py

      - name: Commit and push if changed
        run: |
          git config user.name "OPM Auto Bot"
          git config user.email "bot@noreply.com"
          git add opm_weebcentral.json opm.rss
          if git diff --staged --quiet; then
            echo "No new chapters - nothing to commit"
          else
            git commit -m "Auto-update: new One Punch Man chapter(s)"
            git push
          fi
            git commit -m "Auto-update: new One Punch Man chapter(s)"
            git push
          fi
