name: Auto-update One Punch Man RSS

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
           
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone Weeb-dl and copy weeb folder
        run: |
          git clone https://github.com/UnKnowNModder/Weeb-dl.git /tmp/Weeb-dl
          cp -r /tmp/Weeb-dl/weeb .          # This creates the "weeb" folder in the repo root

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 Pillow fpdf2 ua-generator
        
      - name: Generate fresh opm.rss
        run: python generate_rss.py

      - name: Commit & push if changed
        run: |
          git config user.name "OPM Auto Bot"
          git config user.email "bot@noreply.com"
          git add opm.rss
          if git diff --staged --quiet; then
            echo "No new chapters - nothing to commit"
          else
            git commit -m "Auto-update: new One Punch Man chapter(s)"
            git push
          fi
